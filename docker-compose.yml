services:
  teleagent-dashboard:
    build: .
    image: teleagent-multi:latest
    container_name: teleagent-multi-dashboard
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      PORT: "8580"
      CTYUN_DATA_DIR: /app/data
      # 容器内 DNS 偶发 EAI_AGAIN：固定宿主 resolv 并优先 A 记录
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    dns:
      - 223.5.5.5
      - 119.29.29.29
    volumes:
      - ./data:/app/data
    ports:
      - "8580:8580"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
